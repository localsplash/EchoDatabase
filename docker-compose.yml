# Standalone dev — for full stack use EchoOrchestrator instead.
services:
  echo-database:
    image: mysql:8.4
    container_name: echo-database
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devroot}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-echo_db}
      MYSQL_USER: ${MYSQL_USER:-echo_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-devpass}
    volumes:
      - echo_database_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:13306:3306"
    restart: unless-stopped

volumes:
  echo_database_data:
