services:
  echo-database:
    image: mysql:8.4
    container_name: echo-database
    hostname: echo-database
    env_file:
      - .env
    environment:
      - TZ=America/Los_Angeles
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-echo_db}
      - MYSQL_USER=${MYSQL_USER:-echo_app}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - echomessagingservice_echo_database_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    networks:
      echo-net:
        aliases:
          - echo-database

volumes:
  echomessagingservice_echo_database_data:
    external: true

networks:
  echo-net:
    external: true
